name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest

    env:
      # Tag as entered (e.g. v1.0.0), used for the release and the archives.
      RELEASE_VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version input
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v1.0.0 (optionally with suffix like -beta.1), got: '$VERSION'"
            exit 1
          fi

      - name: Derive build version
        shell: bash
        run: |
          # MSBuild's Version property rejects the tag's leading "v"; the SDK then
          # derives AssemblyVersion, FileVersion and InformationalVersion from it
          # (also stripping a prerelease suffix where required).
          echo "BUILD_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish linux-x64
        run: >
          dotnet publish Timetracker.App/Timetracker.App.csproj -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=$BUILD_VERSION

      - name: Publish win-x64
        run: >
          dotnet publish Timetracker.App/Timetracker.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=$BUILD_VERSION

      - name: Package (tar.gz / zip)
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          LINUX_DIR="Timetracker.App/bin/Release/net10.0/linux-x64/publish"
          WIN_DIR="Timetracker.App/bin/Release/net10.0/win-x64/publish"

          tar -czf "Timetracker-$VERSION-linux-x64.tar.gz" \
            -C "$LINUX_DIR" Timetracker Timetracker.ActivityMonitor
          (cd "$WIN_DIR" && zip -q "../Timetracker-$VERSION-win-x64.zip" Timetracker.exe Timetracker.ActivityMonitor.exe) || \
            (cd "$WIN_DIR" && tar -acf "$OLDPWD/Timetracker-$VERSION-win-x64.zip" Timetracker.exe Timetracker.ActivityMonitor.exe)

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$RELEASE_VERSION"
          gh release create "$VERSION" \
            --title "Timetracker $VERSION" \
            --notes "Timetracker $VERSION - portable cross-platform executables.

          - Timetracker-$VERSION-linux-x64.tar.gz - for 64-bit Linux
          - Timetracker-$VERSION-win-x64.zip - for 64-bit Windows

          Self-contained single-file builds: no .NET installation needed.
          Unzip and run Timetracker (or Timetracker.exe), then use the week view to
          install the PC activity monitor. Data file: timetracker.json in your user folder." \
            "Timetracker-$VERSION-linux-x64.tar.gz" \
            "Timetracker-$VERSION-win-x64.zip"

      - name: Summary
        shell: bash
        run: |
          echo "### Release $RELEASE_VERSION created" >> $GITHUB_STEP_SUMMARY
          echo "- linux-x64 archive: attached" >> $GITHUB_STEP_SUMMARY
          echo "- win-x64 zip: attached" >> $GITHUB_STEP_SUMMARY
